<div
  class="icon-container"
  [style]="{
      '--bgSize': bgSize,
      '--bg': bg,
      '--rounded': rounded=='sm'?'8px':rounded=='full'?'100px':rounded=='md'?'12px':'0px',
      '--borderColor': borderColor
    }"
    [style.border]="borderColor !=='transparent'"
>
  <span
    class="icon"
    [style]="{
        '-webkit-mask-image': 'url(' + icon + ')',
        'mask-image': 'url(' + icon + ')',
        '--size': size,
        '--color': color,
      }"
  >
  </span>
</div>
